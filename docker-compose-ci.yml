version: '3.8'

services:
  # MongoDB Database
  mongo-ci:
    image: mongo:7.0
    container_name: mern-chatbot-mongo-ci
    restart: unless-stopped
    ports:
      - "27018:27017"  # Different port to avoid conflicts with local dev
    environment:
      MONGO_INITDB_DATABASE: mernai_chatbot
    volumes:
      - mongo-ci-data:/data/db  # Persistent volume for database
    networks:
      - mern-network-ci
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API - Using volume mount for code (Part II requirement)
  backend-ci:
    image: node:18-alpine
    container_name: mern-chatbot-backend-ci
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5001:5000"  # Different port for CI
    environment:
      MONGODB_URL: mongodb://mongo-ci:27017/mernai_chatbot
      JWT_SECRET: ${JWT_SECRET:-ci_jwt_secret_change_in_production}
      COOKIE_SECRET: ${COOKIE_SECRET:-ci_cookie_secret_change_in_production}
      OPEN_AI_SECRET: ${OPEN_AI_SECRET}
      OPENROUTER_BASE: ${OPENROUTER_BASE:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.0-flash-exp:free}
      OPEN_AI_STRICT: ${OPEN_AI_STRICT:-0}
      PORT: 5000
    depends_on:
      mongo-ci:
        condition: service_healthy
    networks:
      - mern-network-ci
    volumes:
      - ./backend:/app  # Mount code as volume instead of building image
      - backend-node-modules:/app/node_modules  # Separate volume for node_modules
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Frontend - Using volume mount for code (Part II requirement)
  frontend-ci:
    image: node:18-alpine
    container_name: mern-chatbot-frontend-ci
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"  # Different port for CI
    depends_on:
      - backend-ci
    networks:
      - mern-network-ci
    environment:
      VITE_API_URL: http://localhost:5001
    volumes:
      - ./frontend:/app  # Mount code as volume instead of building image
      - frontend-node-modules:/app/node_modules  # Separate volume for node_modules
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5174"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  mern-network-ci:
    driver: bridge

volumes:
  mongo-ci-data:
    driver: local
  backend-node-modules:
    driver: local
  frontend-node-modules:
    driver: local
