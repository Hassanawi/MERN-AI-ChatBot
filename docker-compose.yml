version: "3.8"

services:
  mongo:
    image: mongo:7.0
    container_name: mern-chatbot-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=mernai_chatbot
    networks:
      - mern-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: mern-chatbot-backend
    restart: unless-stopped
    environment:
      - MONGODB_URL=mongodb://mongo:27017/mernai_chatbot
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_in_production}
      - COOKIE_SECRET=${COOKIE_SECRET:-dev_cookie_secret_change_in_production}
      - OPEN_AI_SECRET=${OPEN_AI_SECRET}
      - OPENROUTER_BASE=${OPENROUTER_BASE:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.0-flash-exp:free}
      - OPEN_AI_STRICT=${OPEN_AI_STRICT:-0}
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - mern-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
    container_name: mern-chatbot-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - mern-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mern-network:
    driver: bridge

volumes:
  mongo_data:
