[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Console output format
console_output_style = progress

# Test report verbosity
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test markers
markers =
    home: marks tests for home page
    login: marks tests for login functionality
    signup: marks tests for signup functionality
    chat: marks tests for chat functionality
    smoke: marks tests as smoke tests
    regression: marks tests as regression tests

# Coverage options
[coverage:run]
source = .
omit = 
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
